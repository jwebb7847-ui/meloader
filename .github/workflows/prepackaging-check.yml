name: Mac app verification
on:
  push:
    branches: [qa/prepackaging-check]
permissions:
  contents: read
jobs:
  mac-app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8ac2d7077596a72db6012b5f281267afe472c749
          path: meloader-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jwebb7847-ui/mebooru
          ref: 2a3861bc4dac471d374133f989a74da48bf4c783
          path: mebooru-src
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: mebooru-src/go.mod
          cache: false
      - name: Build and verify macOS app
        working-directory: mebooru-src
        run: |
          go test ./...
          sh packaging/build-macos-app.sh ../meloader-src
      - name: Exercise both app processes
        working-directory: mebooru-src
        shell: bash
        run: |
          app="$PWD/dist/Mebooru.app"
          export HOME="$RUNNER_TEMP/mebooru-smoke-home"
          mkdir -p "$HOME"
          bin="$app/Contents/MacOS"
          "$bin/monbooru" -version
          "$bin/monloader" -version
          "$bin/monbooru" -no-browser >"$RUNNER_TEMP/mebooru-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/mebooru-smoke.log"' EXIT
          for port in 8455 8456; do
            for n in {1..90}; do
              if curl --fail --silent "http://127.0.0.1:$port/health"; then break; fi
              kill -0 "$pid"
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/health"
          done
          curl -fsS -D "$RUNNER_TEMP/meloader-headers" -o /dev/null "http://127.0.0.1:8456/settings"
          grep -Fi 'frame-ancestors http://127.0.0.1:8455' "$RUNNER_TEMP/meloader-headers"
          kill -TERM "$pid"
          wait "$pid"
          if curl --fail --silent --max-time 3 "http://127.0.0.1:8456/health"; then
            echo 'Companion outlived Mebooru' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mebooru-${{ matrix.os }}
          path: mebooru-src/dist/*.zip
          if-no-files-found: error
