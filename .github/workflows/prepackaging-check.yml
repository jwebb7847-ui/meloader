name: Pre-packaging verification

on:
  push:
    branches: [qa/prepackaging-check]

permissions:
  contents: read

jobs:
  mebooru-codeql:
    name: Mebooru CodeQL source locations
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jwebb7847-ui/mebooru
          ref: 9940c89e98001fb7dc5579f83f24e2b26d1fe86d
          path: mebooru-src
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          languages: go
          build-mode: manual
          source-root: mebooru-src
      - name: Build Mebooru for analysis
        working-directory: mebooru-src
        run: go build ./cmd/monbooru
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          upload: never
          output: ${{ runner.temp }}/mebooru-codeql
      - name: Summarize findings
        shell: bash
        run: |
          python - "$RUNNER_TEMP/mebooru-codeql" <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path
          import sys

          reports = list(Path(sys.argv[1]).glob("*.sarif"))
          if not reports:
              raise SystemExit("No CodeQL report produced")
          findings = collections.Counter()
          for report in reports:
              for run in json.loads(report.read_text(encoding="utf-8"))["runs"]:
                  for item in run.get("results", []):
                      rule = item["ruleId"]
                      findings[rule] += 1
                      loc = item["locations"][0]["physicalLocation"]
                      uri = loc["artifactLocation"]["uri"]
                      fingerprints = item.get("partialFingerprints", {})
                      identity = fingerprints.get("primaryLocationLineHash") or str(loc["region"]["startLine"])
                      digest = hashlib.sha256(f"{rule}|{uri}|{identity}".encode()).hexdigest()[:20]
                      print(f"Triage location {rule} {uri}:{loc['region']['startLine']} {digest}")
          print(f"Mebooru Go CodeQL findings: {sum(findings.values())}")
          for rule, count in sorted(findings.items()):
              print(f"{rule}: {count}")
          PY
