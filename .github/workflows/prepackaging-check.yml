name: Pre-packaging verification

on:
  push:
    branches: [qa/prepackaging-check]

permissions:
  contents: read

jobs:
  native:
    name: Native core smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jwebb7847-ui/mebooru
          ref: 2209a67bb098af1e8bc617c1db3ff5f7d9f18c90
          path: mebooru-src
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Test, build and run both apps
        run: python .github/qa/prepackaging.py

  mebooru-codeql:
    name: Mebooru Go CodeQL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jwebb7847-ui/mebooru
          ref: 2209a67bb098af1e8bc617c1db3ff5f7d9f18c90
          path: mebooru-src
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: mebooru-src/go.mod
          cache: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          languages: go
          build-mode: none
          source-root: mebooru-src
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          upload: never
          output: ${{ runner.temp }}/mebooru-codeql
      - name: Summarize findings
        shell: bash
        run: |
          python - "$RUNNER_TEMP/mebooru-codeql" <<'PY'
          import collections
          import json
          from pathlib import Path
          import sys

          reports = list(Path(sys.argv[1]).glob("*.sarif"))
          if not reports:
              raise SystemExit("No CodeQL report produced")
          findings = collections.Counter()
          for report in reports:
              for run in json.loads(report.read_text(encoding="utf-8"))["runs"]:
                  findings.update(item["ruleId"] for item in run.get("results", []))
          print(f"Mebooru Go CodeQL findings: {sum(findings.values())}")
          for rule, count in sorted(findings.items()):
              print(f"{rule}: {count}")
          PY
